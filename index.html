<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1Q SW1</title>
    <link rel="stylesheet" 
    href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" 
    src="https://pyscript.net/releases/2026.7.3/core.js"></script>

    <style>
        body {
            font-family:'Courier New', Courier, monospace;
            background: #fac3dd;
            margin: 0;
            padding: 30px;
            color: black
        }

        .card {   
            background: white;
            padding: 20px;
            border-radius: 18px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        }

        .h2 {
            color:#f7056f
        }

        .info {
            margin: 12px 0;
            padding: 10px;
            border-radius: 10px;
        }

        button {
            width: 100%;
            padding: 13px;
            background-color: #f70240;
            color: white;
            border-radius: 10px;
            font-size: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: #f50561
        }


    </style>
</head>
<body>
     
    <div class="card">
    <div class="h2">
    <h2>About me</h2>
    </div>
    <div class="info">
    <div>My name is <span id="name"></span></div>
    <div>My age is <span id="age"></span></div>
    <div>My height (in cm) is <span id="height"></span></div>
    <div>Three countries I already visited are <span id="countries"></span></div>
    <div>I'm a new student: <span id="student"></span></div>
    <div>My favorite types of things: <span id="favorite"></span></div>
    <div>My favorite fruits are: <span id="fruits"></span></div>
    <div>Here are the seven days of the week: <span id="weeks"></span></div>
    </div>
    
    <br>
    <div class="h2">
    <h2>Calculator</h2>
    </div>
    <input type="text" id="text1" placeholder="Enter a number here">
    <br><br>
    <input type="text" id="text2" placeholder="Enter a number here">
    <br><br>

    <select id="Operating">
        <option value="Addition">Add</option>
        <option value="Subtraction">Subtract</option>
        <option value="Multiplication">Multiply</option>
        <option value="Division">Divide</option>
    </select>

    <br><br>

    <button type="button" py-click="solving">Solve</button>
    <br>
    <div id="Answer"></div>
    </div>

    <script type="py" src="main.py"></script>

</body>
</html>
