<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1Q SW1</title>
    <link rel="stylesheet" 
    href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" 
    src="https://pyscript.net/releases/2026.7.3/core.js"></script>
</head>
<body>

    <div id="name">My name is</div>
    <div id="age">My age is</div>
    <div id="height">My height (in cm) is</div>
    <div id="countries">Three countries I already visited are</div>
    <div id="student">I'm a new student:</div>
    <div id="favorite">My favorite types of things:</div>
    <div id="weeks">Here are the seven days of the week are</div>

    <br>

    <input type="text" id="text1" placeholder="Enter the number here">
    <br><br>
    <input type="text" id="text2" placeholder="Enter the number here">
    <br><br>

    <select id="Operating">
        <option value="Addition">Add</option>
        <option value="Subtraction">Minus</option>
        <option value="Multiplication">Multiply</option>
        <option value="Division">Divide</option>
    </select>
    <br><br>

    <button type="submit" py-click="solving">Solve</button>
    <div id="Solve"></div>
    <br>
    <div id="Answer"></div>
    
    <script type="py" src="main.py"></script>
    
</body>
</html>
